<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke-linecap="round"
  stroke-linejoin="round"
  role="img"
  aria-label="Tent tree logo"
>
  <style>
    :root {
      --logo-fg: #24292f;
      --logo-halo: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --logo-fg: #f0f6fc;
        --logo-halo: #0d1117;
      }
    }

    .halo {
      stroke: var(--logo-halo);
      stroke-width: 4.75;
      opacity: 0.95;
    }

    .mark {
      stroke: var(--logo-fg);
      stroke-width: 2.25;
    }
  </style>

  <defs>
    <g id="logo-mark">
      <circle cx="4" cy="4" r="2" />
      <path d="m14 5 3-3 3 3" />
      <path d="m14 10 3-3 3 3" />
      <path d="M17 14V2" />
      <path d="M17 14H7l-5 8h20Z" />
      <path d="M8 14v8" />
      <path d="m9 14 5 8" />
    </g>
  </defs>

  <use href="#logo-mark" class="halo" />
  <use href="#logo-mark" class="mark" />
</svg>
