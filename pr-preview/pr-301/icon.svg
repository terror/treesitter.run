<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  role="img"
  aria-label="Tree logo"
>
  <style>
    :root {
      --logo-canopy: #059669;
      --logo-trunk: #24292f;
    }

    .canopy {
      fill: var(--logo-canopy);
    }

    .trunk {
      fill: var(--logo-trunk);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --logo-canopy: #34d399;
        --logo-trunk: #f0f6fc;
      }
    }
  </style>

  <path
    class="canopy"
    d="M12 2.5 7.2 10.15h2.7L5.65 16.8h12.7l-4.25-6.65h2.7Z"
  />
  <path class="trunk" d="M10.55 16.8h2.9v4.2h-2.9Z" />
</svg>
